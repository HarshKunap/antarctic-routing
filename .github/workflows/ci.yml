name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,ml,api]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
      - name: Smoke-run CLI
        run: |
          antroute validate-config
          antroute demo --departure 2026-12-20 --resolution-km 25 --scenarios 80 --out artifacts/ci-demo
