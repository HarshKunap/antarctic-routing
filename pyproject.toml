[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antarctic-routing"
version = "0.1.0"
description = "Antarctic vessel routing and ice-risk forecasting: uncertainty-aware, risk-budgeted route and departure planning (research prototype)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ryanshaon" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "xarray>=2024.1",
  "pyproj>=3.6",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
ingest = ["requests>=2.31", "cdsapi>=0.7", "copernicusmarine>=1.0", "netCDF4>=1.6"]
ml = ["torch>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.6", "netCDF4>=1.6"]

[project.scripts]
antroute = "antarctic_routing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  # cftime/netCDF4 wheels built against an older numpy ABI emit this harmless notice
  "ignore:numpy.ndarray size changed:RuntimeWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E741"]

[tool.ruff.lint.isort]
known-first-party = ["antarctic_routing", "_worlds"]
