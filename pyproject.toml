[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antarctic-routing"
version = "0.1.0"
description = "Antarctic vessel routing and ice-risk forecasting: uncertainty-aware, risk-budgeted route and departure planning (research prototype)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ryanshaon" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "xarray>=2024.1",
  "pyproj>=3.6",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
ingest = ["requests>=2.31", "cdsapi>=0.7", "copernicusmarine>=1.0", "netCDF4>=1.6"]
ml = ["torch>=2.2"]
dev = ["pytest>=8.0", "netCDF4>=1.6"]

[project.scripts]
antroute = "antarctic_routing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
